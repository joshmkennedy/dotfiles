# MY TMUX CONF

set -g mouse on

set -g prefix C-f
unbind C-b
bind C-f send-prefix

set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

set -g base-index 1
setw -g pane-base-index 1

# Needed for zen mode in nvim
set-option -g allow-passthrough all

bind m send-keys "clear;\n"

# bind-key -r i run-shell "tmux neww ~/tmux/scripts/tmux-cht.sh"
bind-key -r o run-shell "tmux neww ~/.bin/tmux-sessionizer"
bind-key -r v run-shell "~/.config/nvim/plugged/harpoon/scripts/tmux/switch-back-to-nvim"

bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key '%' split-window -h -c "#{pane_current_path}"

# This is just because of maybe how Ghostty works.
bind -r Left resize-pane -L 10
bind -r Right resize-pane -R 10
bind -r Up resize-pane -U 10
bind -r Down resize-pane -D 10

bind R source ~/.tmux.conf

set -g mouse on
setw -g mode-keys vi

set-hook -g  'after-new-session' "run-shell ~/dotfiles/.bin/tmux-layout"

# When a pane is focused (switching between panes, windows, etc.)
set-hook -g 'pane-focus-in' "run-shell '~/dotfiles/.bin/tmux-set-title-hook.sh'"

# Optional: When a new window is linked to a session
set-hook -g 'window-linked' "run-shell '~/dotfiles/.bin/tmux-set-title-hook.sh'"

# Optional: When a new client is attached (switching sessions, etc.)
set-hook -g 'client-session-changed' "run-shell '~/dotfiles/.bin/tmux-set-title-hook.sh'"

bind S run-shell "~/dotfiles/.bin/save-tmux-layout"

set -g focus-events on


#PLUGINS
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

source ~/.tmux/colors/catppuccin.conf

run '~/.tmux/plugins/tpm/tpm'



